name: Build OTA Package

on:
  workflow_dispatch:
    inputs:
      use_upx:
        description: Build with UPX compression
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ota:
    name: Build and validate OTA package
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          BACKEND_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/Cargo.toml | head -n 1)
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          test "$BACKEND_VERSION" = "$VERSION"
          test "$FRONTEND_VERSION" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building UDX710 OTA version $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools file
          musl-gcc --version

      - name: Install UPX
        if: inputs.use_upx != false
        run: |
          sudo apt-get install -y upx-ucl
          upx --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-targets: true
          cache-all-crates: true

      - name: Run Rust tests
        working-directory: backend
        run: cargo test --locked

      - name: Build backend for UDX710
        working-directory: backend
        run: |
          export CC_AARCH64_UNKNOWN_LINUX_MUSL=musl-gcc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          export SQLITE3_STATIC=1
          export LIBSQLITE3_SYS_USE_PKG_CONFIG=0
          cargo build --locked --release --target aarch64-unknown-linux-musl
          file target/aarch64-unknown-linux-musl/release/udx710
          file target/aarch64-unknown-linux-musl/release/udx710 | grep -qi aarch64

      - name: Compress backend with UPX
        if: inputs.use_upx != false
        run: upx --best --lzma backend/target/aarch64-unknown-linux-musl/release/udx710

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm run build

      - name: Package and self-check OTA
        run: ./scripts/pack-ota.sh

      - name: Upload OTA package
        uses: actions/upload-artifact@v6
        with:
          name: udx710-ota-${{ steps.version.outputs.version }}
          path: |
            release/udx710-ota-${{ steps.version.outputs.version }}.tar.gz
            release/udx710-ota-${{ steps.version.outputs.version }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/udx710-ota-${{ steps.version.outputs.version }}.tar.gz
            release/udx710-ota-${{ steps.version.outputs.version }}.tar.gz.sha256
          body: |
            ## UDX710 OTA 更新包

            **版本**: ${{ steps.version.outputs.version }}
            **Commit**: ${{ github.sha }}

            此包已由 CI 验证其版本、aarch64 ELF 目标、包结构和 MD5 摘要，可直接从设备管理页面的“OTA 更新”上传。

            建议先保留当前可用的 GitHub OTA 包。新版本可直接应用；低版本包需要在设备 OTA 页面明确确认“降级恢复”。从支持恢复快照的版本执行一次成功 OTA 后，页面会提供“恢复上一版本”。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build summary
        run: |
          {
            echo "## OTA 包构建完成"
            echo ""
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Target: \`aarch64-unknown-linux-musl\`"
            echo "- Package: \`release/udx710-ota-${{ steps.version.outputs.version }}.tar.gz\`"
            echo "- Verification: version sync, Rust tests, frontend build, package structure, ELF target and MD5 self-check"
          } >> "$GITHUB_STEP_SUMMARY"
